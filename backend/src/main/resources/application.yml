server:
  # Vercel's container runtime routes traffic to $PORT (set in the Dockerfile).
  port: ${PORT:8080}

spring:
  application:
    name: neurogames-backend
  # Connects as the postgres role, which BYPASSES the RLS policies in
  # database/schema.sql — those protect direct Supabase client access, not
  # this backend. Every service here must scope queries to the caller's own
  # lecturer id itself (e.g. CollectionRepository.findByIdAndOwnerId).
  # On Vercel, use Supabase's transaction pooler (port 6543): each function
  # instance holds its own pool, and the session pooler (5432) caps all
  # clients at 15, so a few instances exhaust it. Transaction pooling can't
  # keep server-side prepared statements, hence prepareThreshold=0.
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require&prepareThreshold=0
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Small per-instance pool that empties when idle: instances scale out,
      # the database's connection budget doesn't.
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
      # Hikari takes plain milliseconds here.
      idle-timeout: 60000
      connection-timeout: 10000
  jpa:
    # Schema lives in database/schema.sql, run directly against Supabase.
    # Hibernate must never try to create/alter these tables itself: the
    # lecturers table is populated by a Postgres trigger on auth.users and
    # every table has RLS policies that assume the shape in that script.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        # Verifies tokens Supabase Auth already issued — this backend never
        # signs its own. Supabase signs with asymmetric keys (ES256, or RS256
        # after a key rotation) published at the JWKS endpoint below.
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256, RS256
          audiences: authenticated

app:
  ai:
    # Never sent to the frontend — question generation is server-side only.
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  storage:
    # Supabase Storage bucket for uploaded collection resources. Requests are
    # made with the calling teacher's JWT, so the bucket's RLS policies in
    # database/schema.sql apply; the publishable key is not a secret.
    url: ${SUPABASE_URL}/storage/v1
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:Collection-Resources}
    signed-url-ttl: 5m

