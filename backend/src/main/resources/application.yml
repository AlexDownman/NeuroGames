server:
  port: 8080

spring:
  application:
    name: neurogames-backend
  # Connects as the postgres role, which BYPASSES the RLS policies in
  # database/schema.sql — those protect direct Supabase client access, not
  # this backend. Every service here must scope queries to the caller's own
  # lecturer id itself (e.g. CollectionRepository.findByIdAndOwnerId).
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jpa:
    # Schema lives in database/schema.sql, run directly against Supabase.
    # Hibernate must never try to create/alter these tables itself: the
    # lecturers table is populated by a Postgres trigger on auth.users and
    # every table has RLS policies that assume the shape in that script.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        # Verifies tokens Supabase Auth already issued — this backend never
        # signs its own. Supabase signs with asymmetric keys (ES256, or RS256
        # after a key rotation) published at the JWKS endpoint below.
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256, RS256
          audiences: authenticated

app:
  ai:
    # Never sent to the frontend — question generation is server-side only.
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-4o-mini}

